version: '3.8'

services:
  # 1. PostgreSQL Baza Servisi
  db:
    image: postgres:15-alpine
    container_name: vendora_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vendora_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Kesh va Celery Broker Servisi
  redis:
    image: redis:7-alpine
    container_name: vendora_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. FastAPI Web API Servisi
  web:
    build: .
    container_name: vendora_web
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Celery Worker (Asinxron vazifalar uchun)
  pgadmin:
    image: dpage/pgadmin4
    container_name: vendora_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_DISABLE_CLI: "true"
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: